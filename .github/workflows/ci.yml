name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同 ref 新提交自动取消旧运行（Windows 矩阵项全量构建最贵，别让被取代的跑完）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine commit range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=origin/${{ github.base_ref }}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "range=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate commit messages
        shell: bash
        run: |
          fail=0
          for commit in $(git rev-list --reverse "${{ steps.range.outputs.range }}"); do
            msg=$(git log -1 --format=%B "$commit")
            if ! sh scripts/commitlint.sh --message "$msg"; then
              echo "invalid commit: $(git log -1 --oneline "$commit")" >&2
              fail=1
            fi
          done
          exit $fail

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned clang-format (match dev toolchain)
        run: pipx install clang-format==22.1.8 2>/dev/null || pip install clang-format==22.1.8
      - name: Check formatting
        run: |
          clang-format --version
          files=$(find src tests -name '*.cpp' -o -name '*.hpp')
          clang-format --dry-run --Werror $files

  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    needs: [commitlint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: macos-latest, arch: arm64 }
          # macos-13（最后的 Intel 镜像）已从队列饥饿到永不调度：
          # 连续多次 run 排队满 24h 被 GitHub 取消，整条流水线因此恒红。
          # Intel 覆盖等真正需要时再上 osxcross 交叉编译。
          # Windows 发行走静态 triplet（x64-windows-static：静态 CRT + 静态第三方
          # 库）——单 exe 自包含、干净机器解包即用（NFR-001）。动态产物曾连发
          # 5 个坏包（v0.1.1-alpha.1~5 的 zip 缺 vcpkg DLL，构建树 smoke 检测不到）。
          - { os: windows-2022, arch: x64, triplet: x64-windows-static }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          # 进二进制缓存键（见 action 内注释）；非 Windows 矩阵项为空串。
          triplet: ${{ matrix.triplet }}

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.triplet }}" ]; then
            cmake --preset ci -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          else
            cmake --preset ci
          fi

      - name: Build
        run: cmake --build --preset ci

      - name: Assert Windows static linkage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = dumpbin /dependents build/ci/astral.exe | Out-String
          $bad = $out -split "`r?`n" | Select-String -Pattern 'libcurl|libssl|libcrypto|zlib|archive|lzma|xml2|ssh2|brotli'
          if ($bad) { Write-Host $out; throw "dynamic third-party DLL imports found - Windows builds must be fully static" }
          Write-Host "dependents clean (system DLLs only)"

      - name: Unit tests
        run: ctest --preset ci

      - name: Contract tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake --preset ci -DASTRAL_ENABLE_CONTRACT_TESTS=ON > /dev/null
          cmake --build --preset ci > /dev/null
          ctest --preset ci -R contract

      - name: Smoke test (built binary)
        shell: bash
        run: |
          bin="build/ci/astral"
          "$bin" version
          "$bin" doctor --json
          set +e
          # 未绑定目标：稳定契约是 LOCAL_WORKSPACE_ERROR -> exit 8（README
          # 退出码表）。历史断言 -eq 1 钉的是脚手架期 todo 桩的
          # COMMAND_NOT_IMPLEMENTED；round 14 实装后从未被跑到（CI 在更早
          # 的门挂掉），本次随 CI 恢复一并校正。
          "$bin" --json todo list; code=$?
          set -e
          [ "$code" -eq 8 ]
          set +e
          "$bin" bogus; code=$?
          set -e
          [ "$code" -eq 2 ]
